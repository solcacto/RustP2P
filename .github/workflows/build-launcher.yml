name: Build desktop launcher

on:
  workflow_dispatch:
  push:
    branches: [main, "experimental/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build guest wasm
        run: cargo build -p guest --target wasm32-unknown-unknown --release
      - name: Run tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build guest wasm
        run: cargo build -p guest --target wasm32-unknown-unknown --release
      - name: Build binaries
        run: cargo build --release -p host --bin play_game -p launcher --bin launcher

      - name: Assemble macOS app bundle
        shell: bash
        run: |
          set -euxo pipefail
          APP="dist/RustP2P Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/launcher target/release/play_game "$APP/Contents/MacOS/"
          cp -r platform/host/assets "$APP/Contents/MacOS/assets"
          cp platform/host/config.toml "$APP/Contents/MacOS/config.toml"
          mkdir -p "$APP/Contents/MacOS/games"
          cp .github/Info.plist "$APP/Contents/Info.plist"

      - name: Create DMG
        run: |
          hdiutil create -volname "RustP2P Launcher" -srcfolder "dist" -ov -format UDZO RustP2P-Launcher.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: |
            RustP2P-Launcher.dmg
            dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build guest wasm
        run: cargo build -p guest --target wasm32-unknown-unknown --release
      - name: Build binaries
        run: cargo build --release -p host --bin play_game -p launcher --bin launcher

      - name: Assemble dist folder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp target/release/launcher.exe target/release/play_game.exe dist/
          cp -r platform/host/assets dist/assets
          cp platform/host/config.toml dist/config.toml
          mkdir -p dist/games

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath RustP2P-Launcher-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            RustP2P-Launcher-Windows.zip
            dist/