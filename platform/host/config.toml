# Zero-cost deployment configuration for the P2P game platform.
#
# The host launcher (`bin/launcher.rs`) reads this file to discover games and
# connect to the free infrastructure:
#   - Cloudflare Worker  -> WebSocket signaling (SDP/ICE for WebRTC)
#   - GitHub Pages       -> public game registry (games.json)
#   - Public IPFS gateway -> downloading game bundles by CID

[network]
# TODO: Replace this placeholder with the actual URL printed after running `npx wrangler deploy`
signaling_url = "wss://p2p-signal.workers.dev"

stun_servers = ["stun:stun.l.google.com:19302"]

# Leave empty for initial beta testing. Add later if strict NAT users report failures.
turn_servers = []
turn_username = ""
turn_password = ""

# The public discovery registry hosted on GitHub Pages
registry_url = "https://solcacto.github.io/my-platform-registry/games.json"

# Public IPFS gateway used to download a game bundle by CID. The registry only
# carries CIDs; the bundle bytes themselves live on the IPFS swarm and are
# fetched from whichever gateway is reachable (cloudflare-ipfs.com mirrors the
# public network, no account required).
ipfs_gateway = "https://cloudflare-ipfs.com"