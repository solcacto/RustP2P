[package]
name = "host"
version.workspace = true
edition.workspace = true
default-run = "main"

[dependencies]
anyhow = "1"
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_asset",
    "bevy_scene",
    "bevy_ui",
    "bevy_text",
    "multi_threaded",
    "default_font",
] }
ed25519-dalek = "2"
gltf = "1.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signaling_server = { path = "../signaling_server" }
tungstenite = "0.26"
wasmtime = "35"
