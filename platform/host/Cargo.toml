[package]
name = "host"
version.workspace = true
edition.workspace = true
default-run = "main"

[dependencies]
anyhow = "1"
bytes = "1"
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_asset",
    "bevy_scene",
    "bevy_ui",
    "bevy_text",
    "multi_threaded",
    "default_font",
] }
ed25519-dalek = "2"
flate2 = "1"
futures-util = "0.3"
gltf = "1.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
registry_server = { path = "../registry_server" }
signaling_server = { path = "../signaling_server" }
sysinfo = "0.30"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = { version = "0.11", optional = true }
tungstenite = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
wasmtime = "35"
webrtc = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Optional deep profiling via the Tracy profiler (needs a Tracy server).
tracy = ["dep:tracing-tracy", "tracing-tracy/enable"]

[[bench]]
name = "wasm_execution"
harness = false

[[bench]]
name = "network_latency"
harness = false

[[bench]]
name = "network_optimization"
harness = false
