name = "p2p-signal"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Free-tier Workers (workers.dev subdomain). Replace the placeholder in the
# host's config.toml with the URL wrangler prints after `npx wrangler deploy`.
workers_dev = true

# One Durable Object instance holds the signaling registry, so two game
# clients reachable across the internet are guaranteed to share the same
# peer Map regardless of which isolate the runtime places them on.
[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHub"]
