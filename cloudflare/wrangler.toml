name = "p2p-signal"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Free-tier Workers (workers.dev subdomain). Replace the placeholder in the
# host's config.toml with the URL wrangler prints after `npx wrangler deploy`.
workers_dev = true

# A single default Worker — no paid Durable Objects, no binds. State lives in a
# module-level Map, so it resets on deploy (fine for the MVP / beta).
